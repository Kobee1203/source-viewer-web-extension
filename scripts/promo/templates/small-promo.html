<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: radial-gradient(circle at 75% 45%, #0b1a2d 0%, #050a12 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        position: relative;
      }
      /* Background Lucide bracket */
      .b-left {
        position: absolute;
        left: 240px;
        top: 10px;
        width: 140px;
        height: 260px;
        pointer-events: none;
      }
      .container {
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 32px;
        z-index: 1;
        width: 100%;
      }
      .icon-wrap {
        flex-shrink: 0;
        width: 140px;
        height: 140px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.65);
      }
      .icon-wrap img {
        width: 100%;
        height: 100%;
        display: block;
      }
      .title-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .word-white {
        font-size: 38px;
        font-weight: bold;
        line-height: 1.08;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-transform: uppercase;
      }
      .word-cyan {
        font-size: 38px;
        font-weight: bold;
        line-height: 1.08;
        letter-spacing: 0.02em;
        color: #00c4e6;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <svg
      class="b-left"
      viewBox="1 3 7 18"
      preserveAspectRatio="none"
      fill="none"
      stroke="#00c4e6"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.08"
    >
      <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1" />
    </svg>
    <div class="container">
      <div class="icon-wrap">
        <img src="{{ICON_DATA_URL}}" alt="Icon" />
      </div>
      <div class="title-wrap">
        <div class="word-white">SOURCE</div>
        <div class="word-white">CODE</div>
        <div class="word-cyan">VIEWER</div>
      </div>
    </div>
  </body>
</html>
