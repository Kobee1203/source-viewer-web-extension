<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
        background: linear-gradient(135deg, #0a0e15 0%, #11293a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        position: relative;
      }
      /* Background Lucide brackets */
      .brace-left {
        position: absolute;
        left: 495px;
        top: 89px;
        width: 260px;
        height: 440px;
        pointer-events: none;
      }
      .brace-right {
        position: absolute;
        right: 36px;
        top: 89px;
        width: 260px;
        height: 440px;
        pointer-events: none;
      }
      /* Horizontal code lines */
      .code-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .code-line {
        position: absolute;
        height: 14px;
        border-radius: 7px;
        background: #00e4ff;
      }
      .container {
        display: flex;
        align-items: center;
        gap: 60px;
        padding: 0 110px;
        z-index: 1;
        width: 100%;
      }
      .icon-wrap {
        flex-shrink: 0;
        width: 270px;
        height: 270px;
        filter: drop-shadow(0 20px 48px rgba(0, 0, 0, 0.7));
      }
      .icon-wrap img {
        width: 100%;
        height: 100%;
        display: block;
      }
      .content-wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .title-row {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0.01em;
        color: #ffffff;
        text-transform: uppercase;
      }
      .title-cyan {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0.01em;
        color: #00e4ff;
        text-transform: uppercase;
        margin-bottom: 22px;
      }
      .subtitle {
        font-size: 26px;
        font-weight: 400;
        color: #94a3b8;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <svg
      class="brace-left"
      viewBox="1 3 7 18"
      preserveAspectRatio="none"
      fill="none"
      stroke="#00e4ff"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.08"
    >
      <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1" />
    </svg>
    <svg
      class="brace-right"
      viewBox="16 3 7 18"
      preserveAspectRatio="none"
      fill="none"
      stroke="#00e4ff"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.08"
    >
      <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1" />
    </svg>
    <div class="code-lines">
      <div class="code-line" style="top: 150px; left: 1000px; width: 220px; opacity: 0.08"></div>
      <div class="code-line" style="top: 187px; left: 1000px; width: 160px; opacity: 0.08; background: #94a3b8"></div>
      <div class="code-line" style="top: 228px; left: 950px; width: 350px; opacity: 0.08"></div>
      <div class="code-line" style="top: 276px; left: 1050px; width: 240px; opacity: 0.06"></div>
      <div class="code-line" style="top: 297px; left: 990px; width: 180px; opacity: 0.1; background: #94a3b8"></div>
      <div class="code-line" style="top: 317px; left: 990px; width: 250px; opacity: 0.06"></div>
      <div class="code-line" style="top: 359px; left: 1050px; width: 320px; opacity: 0.08"></div>
      <div class="code-line" style="top: 401px; left: 1050px; width: 160px; opacity: 0.05"></div>
    </div>
    <div class="container">
      <div class="icon-wrap">
        <img src="{{ICON_DATA_URL}}" alt="Icon" />
      </div>
      <div class="content-wrap">
        <div class="title-row">SOURCE CODE</div>
        <div class="title-cyan">VIEWER</div>
        <div class="subtitle">View formatted, highlighted page source</div>
      </div>
    </div>
  </body>
</html>
