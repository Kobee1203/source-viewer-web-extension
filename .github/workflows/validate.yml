name: Validate

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Stylelint)
        run: pnpm lint:css

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check (vue-tsc)
        run: pnpm compile

      - name: Store metadata check
        run: pnpm metadata:check

      - name: Build (Chrome + Firefox + Edge)
        run: pnpm build
