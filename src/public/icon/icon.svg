<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111720"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
  </defs>
  <!-- Squircle Background with transparent corners -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Left Brace { -->
  <path d="M 28 26.5 L 20 26.5 C 16.5 26.5 14 29 14 34 L 14 54 C 14 59 10.5 62 5 64 C 10.5 66 14 69 14 74 L 14 94 C 14 99 16.5 101.5 20 101.5 L 28 101.5"
        fill="none" stroke="#00e4ff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Brace } -->
  <path d="M 100 26.5 L 108 26.5 C 111.5 26.5 114 29 114 34 L 114 54 C 114 59 117.5 62 123 64 C 117.5 66 114 69 114 74 L 114 94 C 114 99 111.5 101.5 108 101.5 L 100 101.5"
        fill="none" stroke="#00e4ff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eyebrow Arc -->
  <path d="M 28 41.5 C 38 26.5 90 26.5 100 41.5"
        fill="none" stroke="#00e4ff" stroke-width="7" stroke-linecap="round"/>

  <!-- Eye Almond Contour (Top & Bottom Lids) -->
  <path d="M 22 64 C 33 34.5 95 34.5 106 64 C 95 93.5 33 93.5 22 64 Z"
        fill="none" stroke="#00e4ff" stroke-width="8" stroke-linejoin="round"/>

  <!-- Cyan Ring Around White of Eye -->
  <circle cx="64" cy="64" r="25.5" fill="#00e4ff"/>

  <!-- White of Eye (Iris Disc) -->
  <circle cx="64" cy="64" r="18.5" fill="#ffffff"/>

  <!-- Dark Pupil -->
  <circle cx="64" cy="64" r="12.5" fill="#0d1112"/>

  <!-- Specular Reflection Highlight -->
  <circle cx="69" cy="58" r="4.2" fill="#ffffff"/>
</svg>
